name: Nightly ingest

on:
  schedule:
    - cron: "30 15 * * *"   # 01:30 AEST, after AEMO publishes the previous day's archive
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD or yesterday)"
        default: "yesterday"
      end:
        description: "End date (YYYY-MM-DD or yesterday)"
        default: "yesterday"

concurrency:
  group: nightly-ingest   # never let two runs write the database at once
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START: ${{ inputs.start || 'yesterday' }}
      END: ${{ inputs.end || 'yesterday' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/sagrid.duckdb
          key: sagrid-db-${{ github.run_id }}
          restore-keys: sagrid-db-

      - name: Ingest
        id: ingest
        run: sagrid ingest --start "$START" --end "$END" --datasets region_summary interconnector constraint 2> ingest.log

      - name: Health checks
        id: check
        if: always()
        run: |
          sagrid check --start "$START" --end "$END" | tee check.md
          echo "## Health checks" >> "$GITHUB_STEP_SUMMARY"
          cat check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sagrid.duckdb
          key: sagrid-db-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs-${{ github.run_id }}
          path: |
            ingest.log
            check.md
          retention-days: 30

      - name: Raise or update an alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly ingest failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          $(cat check.md 2>/dev/null || echo 'Health checks did not run.')"
          existing=$(gh issue list --state open --label alert --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create alert --color B60205 --force
            gh issue create --title "$title" --label alert --body "$body"
          fi
