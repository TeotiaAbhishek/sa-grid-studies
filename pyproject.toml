[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sagrid"
version = "0.1.0"
description = "Defensive AEMO NEMWEB pipeline and reproducible power system studies for South Australia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Teotia" }]
dependencies = [
    "pandas>=2.2",
    "pandera>=0.20",
    "duckdb>=1.0",
    "pyarrow>=15",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.5", "pip-audit>=2.7"]

[project.scripts]
sagrid = "sagrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits the live NEMWEB site (skipped unless SAGRID_NETWORK_TESTS=1)"]

[tool.coverage.run]
source = ["sagrid"]
