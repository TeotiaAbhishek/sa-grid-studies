# Copy to sagrid.toml and edit. Every setting can also be set with an
# environment variable, e.g. SAGRID_DB_PATH=data/other.duckdb
[sagrid]
db_path = "data/sagrid.duckdb"
cache_dir = "data/cache"
export_dir = "data/exports"
# registry_path = "data/NEM Registration and Exemption List.xlsx"
log_level = "INFO"
retries = 4
backoff_s = 2.0
timeout_s = 60.0
max_reject_rate = 0.01
max_staleness_hours = 36.0
balance_tolerance_mw = 1.0
